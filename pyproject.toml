[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "itemgen-bench"
version = "1.0.0"
description = "인지검사 문항 생성 벤치마크 — LLM의 문항 작성 능력과 이미지 생성 모델의 명세 준수 능력을 따로 측정하는 파이프라인"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

# 문항 생성·검증·채점·시트까지는 이것만으로 돈다. 무거운 것은 아래 extras로 뺐다.
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "pillow>=9.0",
]

[project.optional-dependencies]
# 이미지를 직접 그릴 때만 필요하다. torch는 환경에 맞는 빌드를 먼저 깔아두는 쪽이 낫다.
render = [
    "diffusers>=0.37",
    "transformers>=4.40",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "peft>=0.10",          # Lightning LoRA. 없으면 LoRA 렌더가 전량 실패한다
]
# 오픈 가중치 모델을 직접 서빙할 때만 필요하다.
# 검증된 CUDA 12.8 조합을 유지한다. 상한 없는 범위는 CUDA 13용 PyTorch를
# 설치해 CUDA 12.8 드라이버에서 기동하지 못할 수 있다.
serve = ["vllm==0.19.1"]
# 납품 artifact를 다시 만들 때만 필요하다. 실행 wheel의 필수 의존성은 아니다.
transfer = [
    "build>=1.2",
    "python-docx>=1.1",
]

[project.scripts]
itemgen = "itemgen_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itemgen_bench = ["py.typed"]

# wheel만 설치해도 기본 명세·로컬 모델 설정·compose 자산을 찾을 수 있게 한다.
[tool.setuptools.data-files]
"share/itemgen-bench/spec" = ["spec/*.json", "spec/*.md"]
"share/itemgen-bench/config" = ["config/*.yaml"]
"share/itemgen-bench/assets" = ["assets/*.png"]
