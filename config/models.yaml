# 실험 설정. LLM arm x 렌더러 arm 을 여기서 정한다.
#
# 전제
#   - 오픈 가중치는 Apache 2.0만 쓴다 (상업 이용). 아래 '쓰면 안 되는 것' 참고.
#   - 로컬 LLM은 vLLM으로 띄우고 openai_compat 어댑터로 붙인다. 24~27B를 bf16으로
#     올리면 가중치만 48~54GB라 80GB 카드 한 장에 하나씩이다.
#
# 준비
#   pip install diffusers transformers accelerate safetensors peft   # 렌더용
#   pip install vllm                                                 # 서빙용
#   export OPENAI_API_KEY=...   VLLM_API_KEY=dummy
#
# 비용 0으로 배선만 확인하려면
#   python3 src/pipeline.py --run wiring --config config/models.stub.yaml

llms:
  # ---- 상용 ----
  - name: gpt6_sol
    adapter: openai_compat
    model: gpt-6-sol
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    temperature: 0.2

  # ---- 오픈 (Apache 2.0) ----
  # 추론형 모델이다. 서버에 --reasoning-parser qwen3 를 반드시 붙인다.
  # 안 붙이면 <think>…</think>가 본문으로 쏟아져 길이 한도에 잘리고,
  # 스키마 합격률이 100% -> 20%로 떨어진다. run_all.sh가 이미 붙여서 띄운다.
  - name: qwen38_27b
    adapter: openai_compat
    model: Qwen/Qwen3.8-27B
    base_url: http://127.0.0.1:8001/v1
    api_key_env: VLLM_API_KEY
    temperature: 0.2
    max_tokens: 16384

  # 비전 타워가 없는 텍스트 전용(MistralForCausalLM)이라 vLLM에 깨끗하게 뜬다.
  # Mistral-Small-3.1 / Ministral-3 계열은 전부 멀티모달이고 vLLM+transformers
  # 조합에 따라 ImportError(PixtralRotaryEmbedding)로 기동이 안 된다.
  - name: mistral_small_24b
    adapter: openai_compat
    model: mistralai/Mistral-Small-24B-Instruct-2501
    base_url: http://127.0.0.1:8003/v1
    api_key_env: VLLM_API_KEY
    temperature: 0.2

  # ---- 보존된 비교 조건 (모델이 아니라 기록) ----
  # 같은 Qwen3.8-27B를 reasoning parser 없이 max_tokens=4096으로 돌린 결과다.
  # readonly라서 gen 단계가 호출하지 않는다. check·render·sheet에는 그대로 나온다.
  # "하네스 설정이 결과를 얼마나 바꾸는가"의 대조군이다.
  - name: qwen38_27b_noparser
    adapter: openai_compat
    model: Qwen/Qwen3.8-27B
    base_url: http://127.0.0.1:8001/v1
    api_key_env: VLLM_API_KEY
    max_tokens: 4096
    readonly: true

renderers:
  # 코드 합성. 추상 도형은 코드로 그리고, 실물은 assets/의 자산을 좌표에 붙인다.
  # 회전·반전·개수·배치가 명세와 정확히 일치한다. 디퓨전이 못 하는 지점이다.
  # 자산은 `itemgen assets --build`로 만든다 (사물 하나당 1장, GPU 1~2분).
  - name: compose
    adapter: compose
    size: 768

  # FLUX.2 klein-4B · Apache 2.0 · 13~16GB · 6스텝
  - name: flux2_klein_4b
    adapter: diffusion
    model: black-forest-labs/FLUX.2-klein-4B
    pipeline: Flux2KleinPipeline
    cfg_param: guidance_scale
    steps: 6
    guidance: 1.0
    size: 768

  # Z-Image-Turbo · Apache 2.0 · 6B · 16GB · 8스텝 고정(증류)
  - name: z_image_turbo
    adapter: diffusion
    model: Tongyi-MAI/Z-Image-Turbo
    pipeline: ZImagePipeline
    cfg_param: guidance_scale
    steps: 8
    guidance: 1.0
    size: 768

  # Qwen-Image-2512 · Apache 2.0 · 20B MMDiT · bf16 48GB+
  # CFG 인자 이름이 다르다. guidance_scale로 주면 조용히 무시된다.
  - name: qwen_image_2512
    adapter: diffusion
    model: Qwen/Qwen-Image-2512
    pipeline: QwenImagePipeline
    cfg_param: true_cfg_scale
    steps: 30
    guidance: 4.0
    size: 768
    negative_prompt: "글자, 숫자, 라벨, 워터마크, 흐릿함, 잘림"

  # 위와 같은 베이스에 4스텝 증류 LoRA만 얹은 것. peft가 설치되어 있어야 한다.
  - name: qwen_image_2512_lightning
    adapter: diffusion
    model: Qwen/Qwen-Image-2512
    pipeline: QwenImagePipeline
    cfg_param: true_cfg_scale
    steps: 4
    guidance: 1.0
    size: 768
    lora: lightx2v/Qwen-Image-2512-Lightning
    lora_weight_name: Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors

  # 쓰면 안 되는 것 (상업 배포 불가)
  #   black-forest-labs/FLUX.2-klein-9B   BFL 비상용
  #   black-forest-labs/FLUX.2-dev        BFL 비상용
  #   Qwen/Qwen-Image-2.1 (7B)            연구 전용. 더 작고 새롭지만 못 쓴다
  #   stabilityai/stable-diffusion-3.5-*  Stability Community License (매출 조건부)

judge:
  # 측정 2. 명세와 이미지를 대조하는 자동 채점기.
  # 1장당 입력 ~720 / 출력 ~170 토큰. 1,704장에 약 $0.26, 8워커로 15분.
  # 사람 검수 표본과 상관을 확인한 뒤 결과를 신뢰할 것.
  name: vlm_luna
  adapter: vlm
  model: gpt-6-luna
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  max_tokens: 400
  detail: auto
  workers: 8

# plan 단계에서 비용·시간을 어림잡는 데만 쓴다. 어댑터에는 전달되지 않는다.
estimates:
  gpt6_sol:                  {price_in: 2.0, price_out: 10.0}   # $/1M 토큰
  compose:                   {sec_per_image: 0.2}               # CPU 실측
  flux2_klein_4b:            {sec_per_image: 8.0}
  z_image_turbo:             {sec_per_image: 9.5}               # 실측
  qwen_image_2512:           {sec_per_image: 45.0}
  qwen_image_2512_lightning: {sec_per_image: 12.0}
