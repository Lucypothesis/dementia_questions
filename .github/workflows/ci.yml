name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[transfer]'

      - name: Check bundled resources
        run: itemgen doctor

      - name: Run self-tests
        run: itemgen selftest

      - name: Generate demo HTML
        run: |
          itemgen demo
          test -s out/demo/sheet.html

      - name: Build wheel and source distribution
        run: python -m build

      - name: Test wheel in a clean virtual environment
        run: bash scripts/acceptance_test.sh dist/itemgen_bench-*.whl
